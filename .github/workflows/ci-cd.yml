# CI/CD Backend API - Se dispara con tags "v*"
name: CI/CD Backend API

on:
  push:
    tags:
      - 'v*'

env:
  DOCKER_IMAGE: madu1206/historia-usuario-api
  INFRA_REPO: jose9410/koncilia-infra
  VALUES_FILE: charts/historia-usuario-api/values.yaml

jobs:
  # Construir imagen Docker y subirla a Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ejecutar pruebas unitarias
        run: dotnet test Tests/HistoriaUsuario.Tests.csproj

      - name: Escaneo de Vulnerabilidades con Snyk
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Instalar SonarScanner Global
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Análisis Estático con SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet sonarscanner begin /k:"historia-usuario-api" /d:sonar.host.url="${SONAR_HOST_URL}" /d:sonar.token="${SONAR_TOKEN}"
          dotnet build
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Extraer versión del tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push de imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_IMAGE }}:latest

  # Actualizar values.yaml en el repo de infra para que Argo CD despliegue
  update-infra:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Extraer versión del tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Checkout repo de infra
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_PAT }}
          ref: main

      - name: Actualizar tag en values.yaml
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/tag: \".*\"/tag: \"${VERSION}\"/" ${{ env.VALUES_FILE }}

      - name: Commit y Push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add ${{ env.VALUES_FILE }}
          git commit -m "chore(api): update image tag to ${{ steps.version.outputs.VERSION }}"
          git push
